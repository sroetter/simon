<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Wars</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; color: #eee; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
canvas { display: block; }
#ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#ui > * { pointer-events: auto; }
.screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
.screen.active { display: flex; }
.btn { background: linear-gradient(180deg, #555, #333); border: 2px solid #777; color: #fff; padding: 14px 36px; font-size: 20px; cursor: pointer; margin: 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; transition: all 0.15s; }
.btn:hover { background: linear-gradient(180deg, #e44, #a22); border-color: #f66; transform: scale(1.05); }
.btn.small { padding: 8px 18px; font-size: 14px; }
.btn.selected { background: linear-gradient(180deg, #e44, #a22); border-color: #f66; box-shadow: 0 0 15px rgba(255,60,60,0.5); }
.back-link { position: absolute; top: 15px; left: 15px; color: #aaa; text-decoration: none; font-size: 16px; }
.back-link:hover { color: #fff; }

/* Title Screen */
#titleScreen { background: radial-gradient(ellipse at center, #222 0%, #0a0a0a 100%); }
.title { font-size: 80px; font-weight: 900; text-transform: uppercase; letter-spacing: 8px; background: linear-gradient(180deg, #fff 0%, #aaa 30%, #666 50%, #aaa 70%, #fff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8)); margin-bottom: 8px; }
.subtitle { color: #888; font-size: 18px; letter-spacing: 6px; margin-bottom: 40px; text-transform: uppercase; }
.title-glow { text-shadow: 0 0 40px rgba(255,60,60,0.3); }

/* Builder Screen */
#builderScreen { background: #151515; overflow-y: auto; align-items: stretch; justify-content: flex-start; padding: 15px; }
.builder-layout { display: flex; width: 100%; max-width: 1200px; margin: 0 auto; gap: 20px; flex: 1; min-height: 0; }
.builder-left { flex: 1; overflow-y: auto; max-height: calc(100vh - 80px); }
.builder-right { width: 320px; position: sticky; top: 0; display: flex; flex-direction: column; gap: 15px; }
.builder-section { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
.builder-section h3 { color: #e44; margin-bottom: 10px; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; }
.option-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.option-card { background: #222; border: 2px solid #444; border-radius: 6px; padding: 10px; cursor: pointer; width: calc(50% - 4px); transition: all 0.15s; }
.option-card:hover { border-color: #888; }
.option-card.selected { border-color: #e44; background: #2a1515; box-shadow: 0 0 10px rgba(255,60,60,0.2); }
.option-card .name { font-weight: bold; font-size: 14px; color: #fff; }
.option-card .desc { font-size: 11px; color: #888; margin-top: 3px; }
.color-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.color-swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #444; cursor: pointer; transition: all 0.15s; }
.color-swatch:hover { transform: scale(1.15); }
.color-swatch.selected { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
.preview-canvas { width: 100%; height: 200px; background: #111; border-radius: 8px; border: 1px solid #333; }
.stats-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
.stat-row { display: flex; align-items: center; gap: 8px; }
.stat-label { width: 80px; font-size: 12px; color: #aaa; text-transform: uppercase; }
.stat-bar-bg { flex: 1; height: 14px; background: #222; border-radius: 3px; overflow: hidden; }
.stat-bar { height: 100%; border-radius: 3px; transition: width 0.3s; }
.stat-val { width: 35px; text-align: right; font-size: 12px; font-weight: bold; }
.builder-title { text-align: center; font-size: 28px; font-weight: 900; color: #e44; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 15px; }
.builder-actions { display: flex; gap: 10px; justify-content: center; padding: 10px; }
.option-card.w3 { width: calc(33.33% - 6px); }

/* HUD */
#hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
#hud.active { display: block; }
.hud-bar { position: absolute; left: 50%; transform: translateX(-50%); height: 28px; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.7); padding: 4px 16px; border-radius: 14px; }
.hud-player { bottom: 20px; }
.hud-enemy { top: 20px; }
.hud-name { font-size: 13px; font-weight: bold; min-width: 80px; }
.hud-hp-bg { width: 200px; height: 18px; background: #333; border-radius: 9px; overflow: hidden; }
.hud-hp { height: 100%; border-radius: 9px; transition: width 0.2s; }
.hud-hp.player { background: linear-gradient(90deg, #4a4, #6d6); }
.hud-hp.enemy { background: linear-gradient(90deg, #d44, #f66); }
.hud-hp-text { font-size: 12px; min-width: 50px; text-align: center; }
.hud-timer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 16px; background: rgba(0,0,0,0.6); padding: 4px 14px; border-radius: 12px; top: 20px; transform: translateX(-50%); }
.hud-weapons { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
.hud-wep { background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 8px; font-size: 12px; border: 1px solid #444; }
.hud-wep .key { color: #e44; font-weight: bold; }
.hud-wep .cd-bar { width: 100%; height: 3px; background: #333; margin-top: 3px; border-radius: 2px; }
.hud-wep .cd-fill { height: 100%; background: #e44; border-radius: 2px; transition: width 0.1s; }
.hud-round { position: absolute; top: 55px; left: 50%; transform: translateX(-50%); font-size: 13px; background: rgba(0,0,0,0.6); padding: 3px 12px; border-radius: 8px; }
.hud-msg { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%); font-size: 48px; font-weight: 900; color: #fff; text-shadow: 0 0 30px rgba(255,60,60,0.8); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.hud-msg.show { opacity: 1; }

/* Result Screen */
#resultScreen { background: rgba(0,0,0,0.85); }
.result-title { font-size: 60px; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; }
.result-title.win { color: #4d4; }
.result-title.lose { color: #d44; }
.result-info { font-size: 18px; color: #aaa; margin-bottom: 30px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <!-- Title Screen -->
  <div id="titleScreen" class="screen active">
    <a href="index.html" class="back-link">&larr; Back</a>
    <div class="title title-glow">ROBOT WARS</div>
    <div class="subtitle">Build. Fight. Destroy.</div>
    <button class="btn" onclick="startMode('build')">Build &amp; Fight</button>
    <button class="btn" onclick="startMode('quick')">Quick Match</button>
    <button class="btn" onclick="startMode('tournament')">Tournament</button>
  </div>

  <!-- Builder Screen -->
  <div id="builderScreen" class="screen">
    <a href="#" class="back-link" onclick="showScreen('titleScreen');return false">&larr; Back</a>
    <div class="builder-title" id="builderTitle">Build Your Robot</div>
    <div class="builder-layout">
      <div class="builder-left" id="builderLeft"></div>
      <div class="builder-right">
        <div class="builder-section">
          <h3>Preview</h3>
          <canvas class="preview-canvas" id="previewCanvas" width="300" height="200"></canvas>
        </div>
        <div class="builder-section">
          <h3>Stats</h3>
          <div class="stats-grid" id="statsGrid"></div>
        </div>
        <div class="builder-actions">
          <button class="btn" onclick="showScreen('titleScreen')">Cancel</button>
          <button class="btn" onclick="startTestArena()" style="background:linear-gradient(180deg,#1a4a2a,#0a3a1a);border-color:#4a4">Test Drive</button>
          <button class="btn" id="fightBtn" onclick="startFight()">Fight!</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-bar hud-enemy">
      <span class="hud-name" id="hudEnemyName">Enemy</span>
      <div class="hud-hp-bg"><div class="hud-hp enemy" id="hudEnemyHp"></div></div>
      <span class="hud-hp-text" id="hudEnemyHpText">100/100</span>
    </div>
    <div class="hud-timer" id="hudTimer">3:00</div>
    <div class="hud-round" id="hudRound" style="display:none">Round 1/4</div>
    <div class="hud-bar hud-player">
      <span class="hud-name" id="hudPlayerName">Player</span>
      <div class="hud-hp-bg"><div class="hud-hp player" id="hudPlayerHp"></div></div>
      <span class="hud-hp-text" id="hudPlayerHpText">100/100</span>
    </div>
    <div class="hud-weapons" id="hudWeapons"></div>
    <div class="hud-msg" id="hudMsg"></div>
  </div>

  <!-- Result Screen -->
  <div id="resultScreen" class="screen">
    <div class="result-title" id="resultTitle">Victory!</div>
    <div class="result-info" id="resultInfo"></div>
    <div id="resultButtons"></div>
  </div>
</div>

<script>
// ============================================================
// ROBOT WARS - Complete Game
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ============================================================
// AUDIO ENGINE
// ============================================================
let audioCtx;
try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { audioCtx = null; }
function ensureAudio() { if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }

function playSound(type, vol = 0.3) {
  ensureAudio();
  if (!audioCtx) return;
  try {
  const now = audioCtx.currentTime;
  const g = audioCtx.createGain();
  g.connect(audioCtx.destination);
  g.gain.setValueAtTime(vol, now);

  if (type === 'metal') {
    // Metal grinding
    const osc = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200 + Math.random()*300, now);
    osc2.type = 'square'; osc2.frequency.setValueAtTime(100 + Math.random()*200, now);
    osc.connect(g); osc2.connect(g);
    g.gain.exponentialDecayTo = 0.01;
    g.gain.setValueAtTime(vol * 0.5, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
    osc2.start(now); osc2.stop(now + 0.15);
  } else if (type === 'impact') {
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.04));
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(g);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    src.start(now);
  } else if (type === 'flipper') {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(100, now);
    osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
    osc.connect(g);
    g.gain.setValueAtTime(vol * 0.6, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
    // Hiss
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.3 * Math.exp(-i / (audioCtx.sampleRate * 0.1));
    const src = audioCtx.createBufferSource(); src.buffer = buf; src.connect(g);
    g.gain.setValueAtTime(vol * 0.4, now + 0.05);
    src.start(now + 0.05);
  } else if (type === 'hammer') {
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const t = i / audioCtx.sampleRate;
      d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 15) + Math.sin(t * 80 * Math.PI * 2) * 0.5 * Math.exp(-t * 10);
    }
    const src = audioCtx.createBufferSource(); src.buffer = buf; src.connect(g);
    g.gain.setValueAtTime(vol * 0.8, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    src.start(now);
  } else if (type === 'explosion') {
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.6, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const t = i / audioCtx.sampleRate;
      d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 4) * (1 + Math.sin(t * 30) * 0.3);
    }
    const src = audioCtx.createBufferSource(); src.buffer = buf; src.connect(g);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    src.start(now);
  } else if (type === 'cheer') {
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 1.2, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const t = i / audioCtx.sampleRate;
      d[i] = (Math.random() * 2 - 1) * 0.3 * (Math.sin(t * 3) * 0.5 + 0.5) * (t < 0.8 ? Math.min(t * 5, 1) : Math.max(0, 1 - (t - 0.8) * 2.5));
    }
    const src = audioCtx.createBufferSource(); src.buffer = buf; src.connect(g);
    g.gain.setValueAtTime(vol * 0.4, now);
    src.start(now);
  } else if (type === 'spark') {
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.08, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.02));
    const src = audioCtx.createBufferSource(); src.buffer = buf; src.connect(g);
    g.gain.setValueAtTime(vol * 0.3, now);
    src.start(now);
  } else if (type === 'engine') {
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(50, now);
    osc.connect(g);
    g.gain.setValueAtTime(vol * 0.1, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    osc.start(now); osc.stop(now + 0.5);
  } else if (type === 'buzzer') {
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(220, now);
    osc.connect(g);
    g.gain.setValueAtTime(vol * 0.3, now);
    g.gain.setValueAtTime(0, now + 0.15);
    g.gain.setValueAtTime(vol * 0.3, now + 0.2);
    g.gain.setValueAtTime(0, now + 0.35);
    g.gain.setValueAtTime(vol * 0.3, now + 0.4);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    osc.start(now); osc.stop(now + 0.6);
  }
  } catch(e) {}
}

// Engine hum
let engineNode = null, engineGain = null;
function startEngine() {
  if (engineNode) return;
  ensureAudio();
  if (!audioCtx) return;
  try {
  engineNode = audioCtx.createOscillator();
  engineGain = audioCtx.createGain();
  engineNode.type = 'sawtooth';
  engineNode.frequency.setValueAtTime(40, audioCtx.currentTime);
  engineGain.gain.setValueAtTime(0.02, audioCtx.currentTime);
  engineNode.connect(engineGain);
  engineGain.connect(audioCtx.destination);
  engineNode.start();
  } catch(e) { engineNode = null; }
}
function updateEngine(speed) {
  if (!engineNode) return;
  engineNode.frequency.setValueAtTime(40 + speed * 60, audioCtx.currentTime);
  engineGain.gain.setValueAtTime(0.015 + speed * 0.02, audioCtx.currentTime);
}
function stopEngine() {
  if (engineNode) { try { engineNode.stop(); } catch(e) {} engineNode = null; engineGain = null; }
}

// ============================================================
// DATA
// ============================================================
const CHASSIS = {
  wedge:       { name: 'Wedge',       desc: 'Triangular, low profile, gets under opponents',  hp: 110, speed: 5.5, attack: 0, armor: 1, weight: 3, shape: 'wedge' },
  box:         { name: 'Box',         desc: 'Balanced stats all around',                      hp: 150, speed: 4,   attack: 0, armor: 2, weight: 5, shape: 'box' },
  drum:        { name: 'Drum',        desc: 'Built around a spinning weapon',                 hp: 130, speed: 4,   attack: 2, armor: 1, weight: 5, shape: 'drum' },
  heavyweight: { name: 'Heavyweight', desc: 'Slow but extremely tanky',                       hp: 230, speed: 2.5, attack: 0, armor: 3, weight: 9, shape: 'heavy' },
  speedDemon:  { name: 'Speed Demon', desc: 'Extremely fast but fragile',                     hp: 90,  speed: 7,   attack: 0, armor: 0, weight: 2, shape: 'oval' },
  ramBot:      { name: 'Ram Bot',     desc: 'Armored battering ram, high push power',         hp: 180, speed: 5,   attack: 1, armor: 2, weight: 7, shape: 'heavy' },
  miniBot:     { name: 'Mini Bot',    desc: 'Tiny and nimble, hard to hit',                   hp: 70,  speed: 8,   attack: 0, armor: 0, weight: 1, shape: 'oval' },
  tank:        { name: 'Tank',        desc: 'Wide tracks, great traction, medium everything', hp: 170, speed: 3.5, attack: 0, armor: 3, weight: 6, shape: 'box' },
};

const PRIMARY_WEAPONS = {
  spinner:    { name: 'Spinner',      desc: 'Spinning bar, big damage + knockback',          damage: 18, cooldown: 0,    type: 'continuous', attack: 3 },
  flipper:    { name: 'Flipper',      desc: 'Launches enemies into the air',                 damage: 8,  cooldown: 2000, type: 'activated',  attack: 1 },
  hammer:     { name: 'Hammer',       desc: 'Overhead slam, high damage, slow',              damage: 25, cooldown: 2000, type: 'activated',  attack: 4 },
  saw:        { name: 'Saw',          desc: 'Constant damage on contact',                    damage: 10, cooldown: 0,    type: 'continuous', attack: 2 },
  crusher:    { name: 'Crusher',      desc: 'Grab and crush, hold to damage',                damage: 12, cooldown: 2500, type: 'activated',  attack: 2 },
  drumSpin:   { name: 'Drum Spinner', desc: 'Vertical spinning drum, huge hits',             damage: 22, cooldown: 0,    type: 'continuous', attack: 4 },
  flamethrower:{ name: 'Flamethrower',desc: 'Short range fire, constant burn damage',        damage: 6,  cooldown: 0,    type: 'continuous', attack: 2 },
  lance:      { name: 'Lance',        desc: 'Long pointed spike, extra ramming damage',      damage: 15, cooldown: 1500, type: 'activated',  attack: 3 },
  dualSpinner:{ name: 'Dual Spinner', desc: 'Two counter-rotating bars, chaotic hits',       damage: 14, cooldown: 0,    type: 'continuous', attack: 3 },
  axe:        { name: 'Overhead Axe', desc: 'Vertical axe chop, can disable weapons',        damage: 20, cooldown: 2200, type: 'activated',  attack: 3 },
};

const SECONDARY_WEAPONS = {
  wedgePlow:    { name: 'Wedge Plow',    desc: 'Front wedge, deflects and gets under enemies',  effect: 'wedge' },
  sideSkirts:   { name: 'Side Skirts',   desc: 'Armor panels, reduce side damage 30%',          effect: 'sideArmor' },
  rearSpike:    { name: 'Rear Spike',    desc: 'Damages enemies hitting your rear',             effect: 'rearSpike' },
  selfRighter:  { name: 'Self-Righter',  desc: 'Flip back over quickly if flipped',             effect: 'selfRight' },
  turboBoost:   { name: 'Turbo Boost',   desc: 'Short speed burst (3s cooldown)',               effect: 'turbo' },
  smokeScreen:  { name: 'Smoke Screen',  desc: 'Blind enemies for 2 sec, AI loses track',       effect: 'smoke' },
  miniBot:      { name: 'Mini Bot',      desc: 'Deploy a tiny bot that distracts the enemy',     effect: 'minibot' },
  entangler:    { name: 'Entangler',     desc: 'Chain that slows enemy movement for 3 sec',      effect: 'entangle' },
};

const ARMOR_TYPES = {
  steel:      { name: 'Steel',      desc: 'Balanced protection, medium weight',           armorMult: 1.0,  speedMult: 1.0,  weightAdd: 0 },
  titanium:   { name: 'Titanium',   desc: 'Lighter, slightly less protection',            armorMult: 0.85, speedMult: 1.15, weightAdd: -1 },
  hardened:   { name: 'Hardened',   desc: 'Maximum protection, heavy and slow',           armorMult: 1.4,  speedMult: 0.8,  weightAdd: 2 },
  carbon:     { name: 'Carbon Fiber', desc: 'Ultra-light, fragile but very fast',         armorMult: 0.6,  speedMult: 1.3,  weightAdd: -2 },
  reactive:   { name: 'Reactive',   desc: 'Explodes on hit, damages attacker back 20%',  armorMult: 1.1,  speedMult: 0.95, weightAdd: 1 },
};

const COLORS = ['#e44', '#44e', '#4c4', '#ec4', '#e4e', '#4cc', '#f80', '#fff'];

const AI_NAMES = ['Tombstone', 'Hypershock', 'Minotaur', 'Witch Doctor', 'Bite Force', 'End Game', 'Blip', 'Cobalt',
                  'Uppercut', 'Sawblaze', 'Whiplash', 'Ribbot', 'Hydra', 'Tantrum', 'Riptide', 'Copperhead'];

// ============================================================
// GAME STATE
// ============================================================
let gameState = 'title'; // title, builder, fight, result
let gameMode = ''; // build, quick, tournament
let tournamentRound = 0;
let playerBuild = { chassis: 'box', primary: 'spinner', secondary: 'turboBoost', armor: 'steel', color: '#e44' };
let playerBot = null, enemyBot = null;
let particles = [];
let hazards = [];
let keys = {};
let fightTimer = 0;
let fightMaxTime = 180; // 3 minutes in seconds
let screenShake = { x: 0, y: 0, intensity: 0 };
let slowMo = 0; // slow motion timer
let arenaW = 800, arenaH = 600;
let camX = 0, camY = 0;
let fightStarted = false;
let countdownTimer = 0;
let lastSpinnerSoundTime = 0;

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true; keys[e.code] = true;
  if (e.key === 'Escape' && gameState === 'test') {
    gameState = 'title';
    document.getElementById('hud').classList.remove('active');
    showBuilder(false);
  }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; keys[e.code] = false; });

// SCREENS
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('hud').classList.remove('active');
}

function startMode(mode) {
  ensureAudio();
  gameMode = mode;
  if (mode === 'quick') {
    randomBuild(playerBuild);
    showBuilder(true);
  } else if (mode === 'build') {
    showBuilder(false);
  } else if (mode === 'tournament') {
    tournamentRound = 0;
    showBuilder(false);
  }
}

function randomBuild(b) {
  const ck = Object.keys(CHASSIS); b.chassis = ck[Math.floor(Math.random()*ck.length)];
  const pk = Object.keys(PRIMARY_WEAPONS); b.primary = pk[Math.floor(Math.random()*pk.length)];
  const sk = Object.keys(SECONDARY_WEAPONS); b.secondary = sk[Math.floor(Math.random()*sk.length)];
  const ak = Object.keys(ARMOR_TYPES); b.armor = ak[Math.floor(Math.random()*ak.length)];
  b.color = COLORS[Math.floor(Math.random()*COLORS.length)];
}

// ============================================================
// BUILDER
// ============================================================
function showBuilder(isQuick) {
  showScreen('builderScreen');
  document.getElementById('builderTitle').textContent = isQuick ? 'Quick Match - Pick Your Bot' : 'Build Your Robot';
  renderBuilder();
}

function renderBuilder() {
  const left = document.getElementById('builderLeft');
  let html = '';

  // Chassis
  html += '<div class="builder-section"><h3>Chassis</h3><div class="option-grid">';
  for (const [k, v] of Object.entries(CHASSIS)) {
    html += `<div class="option-card${playerBuild.chassis===k?' selected':''}" onclick="playerBuild.chassis='${k}';renderBuilder()"><div class="name">${v.name}</div><div class="desc">${v.desc}</div></div>`;
  }
  html += '</div></div>';

  // Primary
  html += '<div class="builder-section"><h3>Primary Weapon</h3><div class="option-grid">';
  for (const [k, v] of Object.entries(PRIMARY_WEAPONS)) {
    html += `<div class="option-card${playerBuild.primary===k?' selected':''}" onclick="playerBuild.primary='${k}';renderBuilder()"><div class="name">${v.name}</div><div class="desc">${v.desc}</div></div>`;
  }
  html += '</div></div>';

  // Secondary
  html += '<div class="builder-section"><h3>Secondary</h3><div class="option-grid">';
  for (const [k, v] of Object.entries(SECONDARY_WEAPONS)) {
    html += `<div class="option-card${playerBuild.secondary===k?' selected':''}" onclick="playerBuild.secondary='${k}';renderBuilder()"><div class="name">${v.name}</div><div class="desc">${v.desc}</div></div>`;
  }
  html += '</div></div>';

  // Armor
  html += '<div class="builder-section"><h3>Armor</h3><div class="option-grid">';
  for (const [k, v] of Object.entries(ARMOR_TYPES)) {
    html += `<div class="option-card w3${playerBuild.armor===k?' selected':''}" onclick="playerBuild.armor='${k}';renderBuilder()"><div class="name">${v.name}</div><div class="desc">${v.desc}</div></div>`;
  }
  html += '</div></div>';

  // Color
  html += '<div class="builder-section"><h3>Color</h3><div class="color-grid">';
  for (const c of COLORS) {
    html += `<div class="color-swatch${playerBuild.color===c?' selected':''}" style="background:${c}" onclick="playerBuild.color='${c}';renderBuilder()"></div>`;
  }
  html += '</div></div>';

  left.innerHTML = html;

  // Stats
  const stats = calcStats(playerBuild);
  const sg = document.getElementById('statsGrid');
  const statDefs = [
    { key: 'hp', label: 'HP', max: 300, color: '#4c4' },
    { key: 'speed', label: 'Speed', max: 10, color: '#4cc' },
    { key: 'attack', label: 'Attack', max: 10, color: '#e44' },
    { key: 'armor', label: 'Armor', max: 8, color: '#ec4' },
    { key: 'weight', label: 'Weight', max: 15, color: '#aaa' }
  ];
  sg.innerHTML = statDefs.map(s => {
    const pct = Math.min(100, (stats[s.key] / s.max) * 100);
    const val = s.key === 'hp' ? Math.round(stats[s.key]) : stats[s.key].toFixed(1);
    return `<div class="stat-row"><div class="stat-label">${s.label}</div><div class="stat-bar-bg"><div class="stat-bar" style="width:${pct}%;background:${s.color}"></div></div><div class="stat-val">${val}</div></div>`;
  }).join('');

  // Preview
  renderPreview();
}

function calcStats(build) {
  const c = CHASSIS[build.chassis];
  const p = PRIMARY_WEAPONS[build.primary];
  const a = ARMOR_TYPES[build.armor];
  return {
    hp: c.hp,
    speed: c.speed * a.speedMult,
    attack: c.attack + p.attack,
    armor: (c.armor + 1) * a.armorMult + (build.secondary === 'sideSkirts' ? 0.5 : 0),
    weight: c.weight + a.weightAdd
  };
}

function renderPreview() {
  const pc = document.getElementById('previewCanvas');
  const pctx = pc.getContext('2d');
  pc.width = 300; pc.height = 200;
  pctx.fillStyle = '#111';
  pctx.fillRect(0, 0, 300, 200);

  // Draw grid
  pctx.strokeStyle = '#1a1a1a';
  for (let x = 0; x < 300; x += 20) { pctx.beginPath(); pctx.moveTo(x, 0); pctx.lineTo(x, 200); pctx.stroke(); }
  for (let y = 0; y < 200; y += 20) { pctx.beginPath(); pctx.moveTo(0, y); pctx.lineTo(300, y); pctx.stroke(); }

  pctx.save();
  pctx.translate(150, 100);
  drawRobot(pctx, { build: playerBuild, angle: -Math.PI/2, spinAngle: performance.now()/200, hp: 1, maxHp: 1, isFlipped: false, isAirborne: false, grabTarget: null, hammerAnim: 0 }, 2.0);
  pctx.restore();
}

// ============================================================
// ROBOT RENDERING
// ============================================================
function drawRobot(ctx2, bot, scale = 1) {
  const b = bot.build || bot;
  const chassis = CHASSIS[b.chassis];
  const sz = (15 + chassis.weight * 1.5) * scale;
  const col = b.color;
  const dmgPct = bot.maxHp ? 1 - (bot.hp / bot.maxHp) : 0;
  const darkCol = darkenColor(col, dmgPct * 0.6);

  ctx2.save();
  ctx2.rotate(bot.angle || 0);

  // Shadow for airborne
  if (bot.isAirborne) {
    const t = bot.airborneTimer || 0;
    const maxT = 1.5;
    const lift = Math.sin((t / maxT) * Math.PI) * 20;
    ctx2.save();
    ctx2.globalAlpha = 0.3;
    ctx2.fillStyle = '#000';
    ctx2.beginPath();
    ctx2.ellipse(0, 0, sz * 1.2, sz * 0.8, 0, 0, Math.PI * 2);
    ctx2.fill();
    ctx2.restore();
    ctx2.translate(0, -lift);
  }

  // Chassis shape
  ctx2.fillStyle = darkCol;
  ctx2.strokeStyle = darkenColor(col, 0.3);
  ctx2.lineWidth = 2 * scale;

  if (chassis.shape === 'wedge') {
    ctx2.beginPath();
    ctx2.moveTo(sz, 0);
    ctx2.lineTo(-sz * 0.7, -sz * 0.7);
    ctx2.lineTo(-sz * 0.7, sz * 0.7);
    ctx2.closePath();
    ctx2.fill(); ctx2.stroke();
  } else if (chassis.shape === 'box') {
    ctx2.fillRect(-sz * 0.7, -sz * 0.6, sz * 1.4, sz * 1.2);
    ctx2.strokeRect(-sz * 0.7, -sz * 0.6, sz * 1.4, sz * 1.2);
  } else if (chassis.shape === 'drum') {
    ctx2.beginPath();
    ctx2.arc(0, 0, sz * 0.8, 0, Math.PI * 2);
    ctx2.fill(); ctx2.stroke();
  } else if (chassis.shape === 'heavy') {
    const rw = sz * 1.0, rh = sz * 0.8;
    roundRect(ctx2, -rw, -rh, rw * 2, rh * 2, 5 * scale);
    ctx2.fill(); ctx2.stroke();
  } else if (chassis.shape === 'oval') {
    ctx2.beginPath();
    ctx2.ellipse(0, 0, sz * 0.9, sz * 0.5, 0, 0, Math.PI * 2);
    ctx2.fill(); ctx2.stroke();
  }

  // Treads/wheels
  ctx2.fillStyle = '#333';
  if (chassis.shape !== 'drum') {
    ctx2.fillRect(-sz * 0.6, -sz * 0.75, sz * 0.3, sz * 0.15);
    ctx2.fillRect(-sz * 0.6, sz * 0.6, sz * 0.3, sz * 0.15);
    ctx2.fillRect(sz * 0.3, -sz * 0.75, sz * 0.3, sz * 0.15);
    ctx2.fillRect(sz * 0.3, sz * 0.6, sz * 0.3, sz * 0.15);
  }

  // Primary weapon
  const pw = b.primary;
  ctx2.fillStyle = '#888';
  ctx2.strokeStyle = '#666';
  ctx2.lineWidth = 1.5 * scale;

  if (pw === 'spinner') {
    ctx2.save();
    ctx2.rotate(bot.spinAngle || 0);
    ctx2.fillStyle = '#aaa';
    ctx2.fillRect(-sz * 0.8, -sz * 0.1, sz * 1.6, sz * 0.2);
    ctx2.strokeRect(-sz * 0.8, -sz * 0.1, sz * 1.6, sz * 0.2);
    // Tips
    ctx2.fillStyle = '#ddd';
    ctx2.fillRect(-sz * 0.85, -sz * 0.15, sz * 0.15, sz * 0.3);
    ctx2.fillRect(sz * 0.7, -sz * 0.15, sz * 0.15, sz * 0.3);
    ctx2.restore();
  } else if (pw === 'flipper') {
    ctx2.fillStyle = '#999';
    ctx2.fillRect(sz * 0.4, -sz * 0.35, sz * 0.4, sz * 0.7);
    ctx2.strokeRect(sz * 0.4, -sz * 0.35, sz * 0.4, sz * 0.7);
    // Flipper plate highlight
    ctx2.fillStyle = '#bbb';
    ctx2.fillRect(sz * 0.7, -sz * 0.3, sz * 0.1, sz * 0.6);
  } else if (pw === 'hammer') {
    const ha = bot.hammerAnim || 0;
    ctx2.save();
    ctx2.translate(0, 0);
    ctx2.rotate(-Math.PI / 3 + ha * Math.PI / 2);
    ctx2.fillStyle = '#888';
    ctx2.fillRect(0, -sz * 0.08, sz * 1.1, sz * 0.16);
    // Hammer head
    ctx2.fillStyle = '#aaa';
    ctx2.fillRect(sz * 0.85, -sz * 0.2, sz * 0.25, sz * 0.4);
    ctx2.restore();
  } else if (pw === 'saw') {
    ctx2.save();
    ctx2.translate(sz * 0.6, 0);
    ctx2.rotate(bot.spinAngle || 0);
    ctx2.beginPath();
    ctx2.arc(0, 0, sz * 0.3, 0, Math.PI * 2);
    ctx2.fillStyle = '#bbb';
    ctx2.fill();
    // Teeth
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      ctx2.beginPath();
      ctx2.moveTo(Math.cos(a) * sz * 0.25, Math.sin(a) * sz * 0.25);
      ctx2.lineTo(Math.cos(a) * sz * 0.38, Math.sin(a) * sz * 0.38);
      ctx2.lineTo(Math.cos(a + 0.3) * sz * 0.28, Math.sin(a + 0.3) * sz * 0.28);
      ctx2.fillStyle = '#ddd';
      ctx2.fill();
    }
    ctx2.restore();
  } else if (pw === 'crusher') {
    // Jaw arms
    const grabOpen = bot.grabTarget ? 0.1 : 0.4;
    ctx2.fillStyle = '#999';
    ctx2.save();
    ctx2.translate(sz * 0.5, 0);
    ctx2.rotate(-grabOpen);
    ctx2.fillRect(0, -sz * 0.06, sz * 0.6, sz * 0.12);
    ctx2.restore();
    ctx2.save();
    ctx2.translate(sz * 0.5, 0);
    ctx2.rotate(grabOpen);
    ctx2.fillRect(0, -sz * 0.06, sz * 0.6, sz * 0.12);
    ctx2.restore();
  }

  // Secondary visual hints
  const sw = b.secondary;
  if (sw === 'wedgePlow') {
    ctx2.fillStyle = '#777';
    ctx2.beginPath();
    ctx2.moveTo(sz * 0.8, -sz * 0.5);
    ctx2.lineTo(sz * 1.05, 0);
    ctx2.lineTo(sz * 0.8, sz * 0.5);
    ctx2.closePath();
    ctx2.fill();
  } else if (sw === 'rearSpike') {
    ctx2.fillStyle = '#999';
    ctx2.beginPath();
    ctx2.moveTo(-sz * 0.7, -sz * 0.15);
    ctx2.lineTo(-sz * 1.1, 0);
    ctx2.lineTo(-sz * 0.7, sz * 0.15);
    ctx2.closePath();
    ctx2.fill();
  } else if (sw === 'sideSkirts') {
    ctx2.fillStyle = 'rgba(150,150,150,0.4)';
    ctx2.fillRect(-sz * 0.5, -sz * 0.8, sz, sz * 0.12);
    ctx2.fillRect(-sz * 0.5, sz * 0.68, sz, sz * 0.12);
  }

  // Flipped X
  if (bot.isFlipped) {
    ctx2.strokeStyle = '#f00';
    ctx2.lineWidth = 3 * scale;
    ctx2.beginPath();
    ctx2.moveTo(-sz * 0.4, -sz * 0.4);
    ctx2.lineTo(sz * 0.4, sz * 0.4);
    ctx2.moveTo(sz * 0.4, -sz * 0.4);
    ctx2.lineTo(-sz * 0.4, sz * 0.4);
    ctx2.stroke();
  }

  // Damage visual: cracks
  if (dmgPct > 0.3) {
    ctx2.strokeStyle = '#000';
    ctx2.lineWidth = 1;
    ctx2.globalAlpha = dmgPct;
    for (let i = 0; i < Math.floor(dmgPct * 5); i++) {
      const ox = (Math.sin(i * 73.1) * sz * 0.5);
      const oy = (Math.cos(i * 41.7) * sz * 0.4);
      ctx2.beginPath();
      ctx2.moveTo(ox, oy);
      ctx2.lineTo(ox + Math.sin(i * 17) * sz * 0.3, oy + Math.cos(i * 23) * sz * 0.3);
      ctx2.stroke();
    }
    ctx2.globalAlpha = 1;
  }

  ctx2.restore();
}

function roundRect(ctx2, x, y, w, h, r) {
  ctx2.beginPath();
  ctx2.moveTo(x + r, y);
  ctx2.arcTo(x + w, y, x + w, y + h, r);
  ctx2.arcTo(x + w, y + h, x, y + h, r);
  ctx2.arcTo(x, y + h, x, y, r);
  ctx2.arcTo(x, y, x + w, y, r);
  ctx2.closePath();
}

function darkenColor(hex, amt) {
  let r = parseInt(hex.slice(1, 3) || hex[1] + hex[1], 16);
  let g = parseInt(hex.slice(2, 4) || hex[2] + hex[2], 16);
  let b = parseInt(hex.slice(3, 5) || hex[3] + hex[3], 16);
  // Handle shorthand like #e44
  if (hex.length === 4) {
    r = parseInt(hex[1] + hex[1], 16);
    g = parseInt(hex[2] + hex[2], 16);
    b = parseInt(hex[3] + hex[3], 16);
  }
  r = Math.floor(r * (1 - amt));
  g = Math.floor(g * (1 - amt));
  b = Math.floor(b * (1 - amt));
  return `rgb(${r},${g},${b})`;
}

// ============================================================
// ROBOT CREATION
// ============================================================
function createBot(build, x, y, angle, isPlayer, name) {
  const stats = calcStats(build);
  const chassis = CHASSIS[build.chassis];
  return {
    build: { ...build },
    x, y, angle,
    vx: 0, vy: 0, va: 0, // velocity
    hp: stats.hp, maxHp: stats.hp,
    speed: stats.speed,
    attack: stats.attack,
    armor: stats.armor,
    weight: stats.weight,
    radius: 15 + chassis.weight * 1.5,
    isPlayer,
    name: name || 'Robot',
    spinAngle: 0,
    spinSpeed: build.primary === 'spinner' ? 0 : (build.primary === 'saw' ? 8 : 0),
    hammerAnim: 0,
    hammerCooldown: 0,
    flipperCooldown: 0,
    crusherCooldown: 0,
    turboCooldown: 0,
    turboActive: 0,
    isFlipped: false,
    flipTimer: 0,
    isAirborne: false,
    airborneTimer: 0,
    grabTarget: null,
    grabTimer: 0,
    grabCooldown: 0,
    hitFlash: 0,
    smokeTimer: 0,
    alive: true,
    // AI
    aiPersonality: '',
    aiTargetAngle: 0,
    aiDecisionTimer: 0,
    aiCharging: false,
    aiRetreatTimer: 0,
  };
}

function createAIBot(difficulty) {
  const aiBuild = {};
  randomBuild(aiBuild);
  // Bias harder builds at higher difficulty
  if (difficulty > 2) {
    const goodChassis = ['box', 'drum', 'heavyweight'];
    aiBuild.chassis = goodChassis[Math.floor(Math.random() * goodChassis.length)];
  }
  aiBuild.color = COLORS[Math.floor(Math.random() * COLORS.length)];
  // Avoid same color as player
  while (aiBuild.color === playerBuild.color) aiBuild.color = COLORS[Math.floor(Math.random() * COLORS.length)];

  const name = AI_NAMES[Math.floor(Math.random() * AI_NAMES.length)];
  const bot = createBot(aiBuild, arenaW * 0.75, arenaH / 2, Math.PI, false, name);

  const personalities = ['aggressive', 'tactical', 'defensive'];
  bot.aiPersonality = personalities[Math.floor(Math.random() * personalities.length)];

  // Scale with difficulty
  bot.hp = Math.floor(bot.hp * (1 + difficulty * 0.1));
  bot.maxHp = bot.hp;
  bot.attack += difficulty * 0.5;

  return bot;
}

function createHazards() {
  hazards = [];
  // Floor spinner
  hazards.push({ type: 'floorSpinner', x: arenaW * 0.3, y: arenaH * 0.3, radius: 30, angle: 0, damage: 10 });
  hazards.push({ type: 'floorSpinner', x: arenaW * 0.7, y: arenaH * 0.7, radius: 30, angle: 0, damage: 10 });
  // Pit removed - was too punishing
  // Fire jets
  hazards.push({ type: 'fireJet', x: arenaW * 0.2, y: arenaH * 0.7, radius: 22, active: false, timer: 0, damage: 12 });
  hazards.push({ type: 'fireJet', x: arenaW * 0.8, y: arenaH * 0.3, radius: 22, active: false, timer: 0, damage: 12 });
  // Hammer zone
  hazards.push({ type: 'hammerZone', x: arenaW * 0.5, y: arenaH * 0.15, radius: 28, active: false, timer: 0, damage: 15, hammerAnim: 0 });
  hazards.push({ type: 'hammerZone', x: arenaW * 0.5, y: arenaH * 0.85, radius: 28, active: false, timer: 0, damage: 15, hammerAnim: 0 });
}

function startTestArena() {
  ensureAudio();
  gameState = 'test';
  fightStarted = true; // skip countdown

  arenaW = Math.min(W - 40, 900);
  arenaH = Math.min(H - 40, 650);

  playerBot = createBot(playerBuild, arenaW / 2, arenaH / 2, 0, true, 'You (Test)');

  // Create a dummy target bot that doesn't move (punching bag)
  const dummyBuild = { chassis: 'box', primary: 'saw', secondary: 'sideSkirts', armor: 'steel', color: '#888' };
  enemyBot = createBot(dummyBuild, arenaW * 0.75, arenaH / 2, Math.PI, false, 'Dummy');
  enemyBot.aiType = 'dummy'; // won't move

  particles = [];
  createHazards();
  fightTimer = 60; // 1 minute test
  slowMo = 0;
  screenShake = { x: 0, y: 0, intensity: 0 };

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('hud').classList.add('active');
  document.getElementById('hudPlayerName').textContent = 'TEST MODE';
  document.getElementById('hudEnemyName').textContent = 'Dummy';
  const el = document.getElementById('hudRound');
  el.style.display = 'block';
  el.textContent = 'Test Drive - Press ESC to exit';

  updateWeaponHud();
  startEngine();
}

function startFight() {
  ensureAudio();
  gameState = 'fight';
  fightStarted = false;
  countdownTimer = 3;

  // Resize arena to fit screen
  arenaW = Math.min(W - 40, 900);
  arenaH = Math.min(H - 40, 650);

  playerBot = createBot(playerBuild, arenaW * 0.25, arenaH / 2, 0, true, 'You');

  const diff = gameMode === 'tournament' ? tournamentRound + 1 : 1;
  enemyBot = createAIBot(diff);

  particles = [];
  createHazards();
  fightTimer = fightMaxTime;
  slowMo = 0;
  screenShake = { x: 0, y: 0, intensity: 0 };

  showScreen('titleScreen'); // hide all screens
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('hud').classList.add('active');

  // HUD
  document.getElementById('hudPlayerName').textContent = playerBot.name;
  document.getElementById('hudEnemyName').textContent = enemyBot.name;
  updateHudRound();
  updateWeaponHud();

  startEngine();
}

function updateHudRound() {
  const el = document.getElementById('hudRound');
  if (gameMode === 'tournament') {
    el.style.display = 'block';
    el.textContent = `Round ${tournamentRound + 1} / 4`;
  } else {
    el.style.display = 'none';
  }
}

function updateWeaponHud() {
  const hw = document.getElementById('hudWeapons');
  const p = PRIMARY_WEAPONS[playerBuild.primary];
  const s = SECONDARY_WEAPONS[playerBuild.secondary];
  hw.innerHTML = `
    <div class="hud-wep"><span class="key">SPACE</span> ${p.name}<div class="cd-bar"><div class="cd-fill" id="cdPrimary" style="width:100%"></div></div></div>
    <div class="hud-wep"><span class="key">SHIFT</span> ${s.name}<div class="cd-bar"><div class="cd-fill" id="cdSecondary" style="width:100%"></div></div></div>
  `;
}

// ============================================================
// PARTICLES
// ============================================================
function spawnSparks(x, y, count, col) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 4;
    particles.push({
      type: 'spark', x, y,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: 0.3 + Math.random() * 0.3,
      maxLife: 0.3 + Math.random() * 0.3,
      size: 1.5 + Math.random() * 2,
      color: col || '#fc4'
    });
  }
}

function spawnSmoke(x, y, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      type: 'smoke', x: x + (Math.random()-0.5)*10, y: y + (Math.random()-0.5)*10,
      vx: (Math.random()-0.5)*0.5, vy: -0.5 - Math.random()*0.5,
      life: 0.5 + Math.random() * 0.5,
      maxLife: 0.5 + Math.random() * 0.5,
      size: 3 + Math.random() * 5,
      color: '#555'
    });
  }
}

function spawnFire(x, y, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    particles.push({
      type: 'fire', x: x + (Math.random()-0.5)*8, y: y + (Math.random()-0.5)*8,
      vx: Math.cos(a) * 0.5, vy: -1 - Math.random() * 2,
      life: 0.3 + Math.random() * 0.3,
      maxLife: 0.3 + Math.random() * 0.3,
      size: 3 + Math.random() * 4,
      color: '#f80'
    });
  }
}

function spawnExplosion(x, y) {
  spawnSparks(x, y, 30, '#ff0');
  spawnSparks(x, y, 20, '#f80');
  spawnSparks(x, y, 15, '#f00');
  spawnSmoke(x, y, 15);
  // Debris
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 5;
    particles.push({
      type: 'debris', x, y,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: 0.8 + Math.random() * 0.5,
      maxLife: 0.8 + Math.random() * 0.5,
      size: 3 + Math.random() * 5,
      color: '#888',
      rotSpeed: (Math.random() - 0.5) * 10,
      rot: Math.random() * Math.PI * 2
    });
  }
}

// ============================================================
// PHYSICS & COMBAT
// ============================================================
function updateBot(bot, dt) {
  if (!bot.alive) return;

  // Cooldowns
  if (bot.hammerCooldown > 0) bot.hammerCooldown -= dt * 1000;
  if (bot.flipperCooldown > 0) bot.flipperCooldown -= dt * 1000;
  if (bot.crusherCooldown > 0) bot.crusherCooldown -= dt * 1000;
  if (bot.grabCooldown > 0) bot.grabCooldown -= dt * 1000;
  if (bot.turboCooldown > 0) bot.turboCooldown -= dt * 1000;
  if (bot.turboActive > 0) bot.turboActive -= dt * 1000;
  if (bot.hitFlash > 0) bot.hitFlash -= dt;
  if (bot.hammerAnim > 0) bot.hammerAnim = Math.max(0, bot.hammerAnim - dt * 3);

  // Flipped state
  if (bot.isFlipped) {
    bot.flipTimer -= dt;
    if (bot.flipTimer <= 0) {
      bot.isFlipped = false;
    }
    // Can't move when flipped
    bot.vx *= 0.9;
    bot.vy *= 0.9;
    bot.va *= 0.9;
    bot.x += bot.vx; bot.y += bot.vy; bot.angle += bot.va;
    clampToArena(bot);
    return;
  }

  // Airborne state
  if (bot.isAirborne) {
    bot.airborneTimer -= dt;
    if (bot.airborneTimer <= 0) {
      bot.isAirborne = false;
      // Chance to land flipped if damaged
      if (bot.hp < bot.maxHp * 0.5 && Math.random() < 0.4) {
        bot.isFlipped = true;
        bot.flipTimer = bot.build.secondary === 'selfRighter' ? 0.5 : 3;
        playSound('impact', 0.4);
      }
    }
    bot.x += bot.vx * 0.3;
    bot.y += bot.vy * 0.3;
    clampToArena(bot);
    return;
  }

  // Grabbed state
  if (bot.grabTarget) {
    bot.grabTimer -= dt;
    if (bot.grabTimer <= 0) {
      bot.grabTarget.grabTarget = null;
      bot.grabTarget = null;
    } else {
      // Damage over time from crusher
      // handled in collision
    }
    bot.vx *= 0.85; bot.vy *= 0.85;
    bot.x += bot.vx; bot.y += bot.vy;
    clampToArena(bot);
    return;
  }

  // Spinner speed
  if (bot.build.primary === 'spinner') {
    bot.spinSpeed = Math.min(bot.spinSpeed + dt * 4, 12);
    bot.spinAngle += bot.spinSpeed * dt;
  } else if (bot.build.primary === 'saw') {
    bot.spinAngle += 8 * dt;
  }

  // Smoke when damaged
  if (bot.hp < bot.maxHp * 0.5) {
    bot.smokeTimer -= dt;
    if (bot.smokeTimer <= 0) {
      bot.smokeTimer = 0.2;
      spawnSmoke(bot.x, bot.y, 1);
      if (bot.hp < bot.maxHp * 0.25) spawnFire(bot.x, bot.y, 1);
    }
  }

  // Friction
  const friction = 0.92;
  bot.vx *= friction;
  bot.vy *= friction;
  bot.va *= 0.88;

  // Apply velocity
  bot.x += bot.vx;
  bot.y += bot.vy;
  bot.angle += bot.va;

  clampToArena(bot);
}

function clampToArena(bot) {
  const margin = bot.radius;
  if (bot.x < margin) { bot.x = margin; bot.vx = Math.abs(bot.vx) * 0.3; damageBot(bot, 3, 'wall'); }
  if (bot.x > arenaW - margin) { bot.x = arenaW - margin; bot.vx = -Math.abs(bot.vx) * 0.3; damageBot(bot, 3, 'wall'); }
  if (bot.y < margin) { bot.y = margin; bot.vy = Math.abs(bot.vy) * 0.3; damageBot(bot, 3, 'wall'); }
  if (bot.y > arenaH - margin) { bot.y = arenaH - margin; bot.vy = -Math.abs(bot.vy) * 0.3; damageBot(bot, 3, 'wall'); }
}

function damageBot(bot, amount, source) {
  if (!bot.alive || bot.isAirborne) return;
  // Armor reduction
  const reduction = bot.armor * 0.07;
  let dmg = Math.max(1, amount * (1 - reduction));

  // Side skirts check
  if (bot.build.secondary === 'sideSkirts' && source !== 'wall') {
    dmg *= 0.7;
  }

  bot.hp -= dmg;
  bot.hitFlash = 0.1;

  if (bot.hp <= 0) {
    bot.hp = 0;
    bot.alive = false;
    spawnExplosion(bot.x, bot.y);
    playSound('explosion', 0.6);
    slowMo = 1.0; // slow-mo kill cam
    addShake(15);
  }
}

function addShake(intensity) {
  screenShake.intensity = Math.max(screenShake.intensity, intensity);
}

// ============================================================
// PLAYER INPUT
// ============================================================
function handlePlayerInput(bot, dt) {
  if (!bot.alive || bot.isFlipped || bot.isAirborne || bot.grabTarget) return;

  const fwd = (keys['w'] || keys['arrowup']) ? 1 : (keys['s'] || keys['arrowdown']) ? -1 : 0;
  const turn = (keys['a'] || keys['arrowleft']) ? -1 : (keys['d'] || keys['arrowright']) ? 1 : 0;

  let spd = bot.speed * 0.6;
  if (bot.turboActive > 0) spd *= 1.8;

  // Inertia - heavier = slower acceleration
  const accel = 0.3 / (1 + bot.weight * 0.08);

  if (fwd !== 0) {
    bot.vx += Math.cos(bot.angle) * fwd * spd * accel;
    bot.vy += Math.sin(bot.angle) * fwd * spd * accel;
  }
  if (turn !== 0) {
    bot.va += turn * 0.008 * (2 + bot.speed) / (1 + bot.weight * 0.1);
  }

  // Clamp velocity
  const maxV = spd * 1.5;
  const v = Math.sqrt(bot.vx * bot.vx + bot.vy * bot.vy);
  if (v > maxV) { bot.vx *= maxV / v; bot.vy *= maxV / v; }

  // Engine sound
  updateEngine(v / maxV);

  // Primary weapon activation
  if (keys[' '] || keys['Space']) {
    activatePrimary(bot);
  }

  // Secondary
  if (keys['shift'] || keys['Shift']) {
    activateSecondary(bot);
  }
}

function activatePrimary(bot) {
  const pw = bot.build.primary;
  if (pw === 'flipper' && bot.flipperCooldown <= 0) {
    bot.flipperCooldown = 2000;
    playSound('flipper', 0.4);
    // Check if enemy is in front and close
    const other = bot.isPlayer ? enemyBot : playerBot;
    if (other.alive && !other.isAirborne) {
      const dx = other.x - bot.x, dy = other.y - bot.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const angleToOther = Math.atan2(dy, dx);
      const angleDiff = Math.abs(normalizeAngle(angleToOther - bot.angle));
      if (dist < bot.radius + other.radius + 15 && angleDiff < Math.PI / 2.5) {
        damageBot(other, PRIMARY_WEAPONS.flipper.damage + bot.attack, 'flipper');
        other.isAirborne = true;
        other.airborneTimer = 1.5;
        other.vx += Math.cos(bot.angle) * 3;
        other.vy += Math.sin(bot.angle) * 3;
        spawnSparks(other.x, other.y, 10, '#ff0');
        addShake(8);
      }
    }
  } else if (pw === 'hammer' && bot.hammerCooldown <= 0) {
    bot.hammerCooldown = 2000;
    bot.hammerAnim = 1;
    playSound('hammer', 0.5);
    // Check front area
    const other = bot.isPlayer ? enemyBot : playerBot;
    if (other.alive && !other.isAirborne) {
      const dx = other.x - bot.x, dy = other.y - bot.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const angleToOther = Math.atan2(dy, dx);
      const angleDiff = Math.abs(normalizeAngle(angleToOther - bot.angle));
      if (dist < bot.radius + other.radius + 20 && angleDiff < Math.PI / 3) {
        damageBot(other, PRIMARY_WEAPONS.hammer.damage + bot.attack * 2, 'hammer');
        other.vx += Math.cos(bot.angle) * 4;
        other.vy += Math.sin(bot.angle) * 4;
        spawnSparks((bot.x + other.x)/2, (bot.y + other.y)/2, 15, '#fc4');
        addShake(12);
      }
    }
  } else if (pw === 'crusher' && bot.crusherCooldown <= 0 && !bot.grabTarget) {
    const other = bot.isPlayer ? enemyBot : playerBot;
    if (other.alive && !other.isAirborne && !other.grabTarget) {
      const dx = other.x - bot.x, dy = other.y - bot.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const angleToOther = Math.atan2(dy, dx);
      const angleDiff = Math.abs(normalizeAngle(angleToOther - bot.angle));
      if (dist < bot.radius + other.radius + 10 && angleDiff < Math.PI / 3) {
        bot.grabTarget = other;
        other.grabTarget = bot;
        bot.grabTimer = 2;
        other.grabTimer = 2;
        bot.crusherCooldown = 2500;
        playSound('metal', 0.4);
      }
    }
  }
}

function activateSecondary(bot) {
  const sw = bot.build.secondary;
  if (sw === 'turboBoost' && bot.turboCooldown <= 0) {
    bot.turboCooldown = 3000;
    bot.turboActive = 500;
    bot.vx += Math.cos(bot.angle) * 5;
    bot.vy += Math.sin(bot.angle) * 5;
    playSound('flipper', 0.2);
  }
}

function normalizeAngle(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

// ============================================================
// AI
// ============================================================
function updateAI(bot, dt) {
  if (!bot.alive || bot.isFlipped || bot.isAirborne || bot.grabTarget) return;
  if (bot.aiType === 'dummy') return; // test dummy doesn't move

  const target = playerBot;
  if (!target.alive) return;

  const dx = target.x - bot.x, dy = target.y - bot.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const angleToTarget = Math.atan2(dy, dx);

  bot.aiDecisionTimer -= dt;
  if (bot.aiDecisionTimer <= 0) {
    bot.aiDecisionTimer = 0.3 + Math.random() * 0.5;

    if (bot.aiPersonality === 'aggressive') {
      bot.aiTargetAngle = angleToTarget;
      bot.aiCharging = true;
    } else if (bot.aiPersonality === 'tactical') {
      // Flank: aim slightly off to the side
      const flankOffset = (Math.random() < 0.5 ? 1 : -1) * (Math.PI / 6 + Math.random() * Math.PI / 6);
      if (dist > 150) {
        bot.aiTargetAngle = angleToTarget + flankOffset * 0.5;
      } else {
        bot.aiTargetAngle = angleToTarget;
      }
      bot.aiCharging = dist < 200;
    } else { // defensive
      if (dist > 200) {
        bot.aiTargetAngle = angleToTarget;
        bot.aiCharging = false;
      } else {
        bot.aiTargetAngle = angleToTarget;
        bot.aiCharging = true;
      }
      // Retreat when low HP
      if (bot.hp < bot.maxHp * 0.25) {
        bot.aiTargetAngle = angleToTarget + Math.PI;
        bot.aiRetreatTimer = 1;
      }
    }

    // Avoid hazards
    for (const h of hazards) {
      if (h.type === 'pit') {
        const hd = Math.sqrt((bot.x - h.x) ** 2 + (bot.y - h.y) ** 2);
        if (hd < 80) {
          const away = Math.atan2(bot.y - h.y, bot.x - h.x);
          bot.aiTargetAngle = away;
        }
      }
    }
  }

  if (bot.aiRetreatTimer > 0) {
    bot.aiRetreatTimer -= dt;
  }

  // Turn toward target angle
  const angleDiff = normalizeAngle(bot.aiTargetAngle - bot.angle);
  const turnRate = 0.008 * (2 + bot.speed) / (1 + bot.weight * 0.1);
  bot.va += Math.sign(angleDiff) * Math.min(Math.abs(angleDiff) * 0.1, turnRate);

  // Drive forward
  const spd = bot.speed * 0.6;
  const accel = 0.3 / (1 + bot.weight * 0.08);
  const facingTarget = Math.abs(angleDiff) < Math.PI / 3;

  if (facingTarget || bot.aiCharging) {
    bot.vx += Math.cos(bot.angle) * spd * accel * 0.8;
    bot.vy += Math.sin(bot.angle) * spd * accel * 0.8;
  }

  // Clamp velocity
  const maxV = spd * 1.5;
  const v = Math.sqrt(bot.vx * bot.vx + bot.vy * bot.vy);
  if (v > maxV) { bot.vx *= maxV / v; bot.vy *= maxV / v; }

  // Weapon usage
  if (dist < bot.radius + target.radius + 25 && facingTarget) {
    activatePrimary(bot);
  }

  // Secondary
  if (bot.build.secondary === 'turboBoost' && dist > 150 && facingTarget && bot.turboCooldown <= 0) {
    activateSecondary(bot);
  }
}

// ============================================================
// COLLISIONS
// ============================================================
function checkBotCollision(a, b, dt) {
  if (!a.alive || !b.alive) return;
  if (a.isAirborne || b.isAirborne) return;

  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const minDist = a.radius + b.radius;

  if (dist < minDist && dist > 0) {
    // Separate
    const overlap = (minDist - dist) / 2;
    const nx = dx / dist, ny = dy / dist;
    a.x -= nx * overlap;
    a.y -= ny * overlap;
    b.x += nx * overlap;
    b.y += ny * overlap;

    // Momentum transfer based on weight
    const totalWeight = a.weight + b.weight;
    const aFactor = b.weight / totalWeight;
    const bFactor = a.weight / totalWeight;

    const relVx = a.vx - b.vx, relVy = a.vy - b.vy;
    const relSpeed = Math.sqrt(relVx * relVx + relVy * relVy);

    a.vx -= nx * relSpeed * aFactor * 0.5;
    a.vy -= ny * relSpeed * aFactor * 0.5;
    b.vx += nx * relSpeed * bFactor * 0.5;
    b.vy += ny * relSpeed * bFactor * 0.5;

    // Contact damage from continuous weapons
    const now = performance.now();

    // Spinner damage
    if (a.build.primary === 'spinner' && a.spinSpeed > 3) {
      const dmg = PRIMARY_WEAPONS.spinner.damage * (a.spinSpeed / 12) + a.attack;
      damageBot(b, dmg, 'spinner');
      b.vx += nx * a.spinSpeed * 0.5;
      b.vy += ny * a.spinSpeed * 0.5;
      a.spinSpeed *= 0.4; // Spinner slows on hit
      spawnSparks((a.x + b.x)/2, (a.y + b.y)/2, 12, '#fc4');
      addShake(6 + dmg * 0.3);
      if (now - lastSpinnerSoundTime > 200) {
        playSound('metal', 0.4);
        lastSpinnerSoundTime = now;
      }
    }
    if (b.build.primary === 'spinner' && b.spinSpeed > 3) {
      const dmg = PRIMARY_WEAPONS.spinner.damage * (b.spinSpeed / 12) + b.attack;
      damageBot(a, dmg, 'spinner');
      a.vx -= nx * b.spinSpeed * 0.5;
      a.vy -= ny * b.spinSpeed * 0.5;
      b.spinSpeed *= 0.4;
      spawnSparks((a.x + b.x)/2, (a.y + b.y)/2, 12, '#fc4');
      addShake(6 + dmg * 0.3);
      if (now - lastSpinnerSoundTime > 200) {
        playSound('metal', 0.4);
        lastSpinnerSoundTime = now;
      }
    }

    // Saw damage (front of bot)
    if (a.build.primary === 'saw') {
      const aToB = Math.atan2(dy, dx);
      if (Math.abs(normalizeAngle(aToB - a.angle)) < Math.PI / 2.5) {
        damageBot(b, (PRIMARY_WEAPONS.saw.damage + a.attack) * dt * 3, 'saw');
        spawnSparks((a.x + b.x)/2, (a.y + b.y)/2, 3, '#ff0');
        if (now - lastSpinnerSoundTime > 300) { playSound('spark', 0.3); lastSpinnerSoundTime = now; }
      }
    }
    if (b.build.primary === 'saw') {
      const bToA = Math.atan2(-dy, -dx);
      if (Math.abs(normalizeAngle(bToA - b.angle)) < Math.PI / 2.5) {
        damageBot(a, (PRIMARY_WEAPONS.saw.damage + b.attack) * dt * 3, 'saw');
        spawnSparks((a.x + b.x)/2, (a.y + b.y)/2, 3, '#ff0');
        if (now - lastSpinnerSoundTime > 300) { playSound('spark', 0.3); lastSpinnerSoundTime = now; }
      }
    }

    // Rear spike
    if (a.build.secondary === 'rearSpike') {
      const bToA = Math.atan2(-dy, -dx);
      if (Math.abs(normalizeAngle(bToA - a.angle - Math.PI)) < Math.PI / 3) {
        damageBot(b, 8, 'spike');
        spawnSparks(a.x - Math.cos(a.angle) * a.radius, a.y - Math.sin(a.angle) * a.radius, 5, '#f80');
      }
    }
    if (b.build.secondary === 'rearSpike') {
      const aToB2 = Math.atan2(dy, dx);
      if (Math.abs(normalizeAngle(aToB2 - b.angle - Math.PI)) < Math.PI / 3) {
        damageBot(a, 8, 'spike');
        spawnSparks(b.x - Math.cos(b.angle) * b.radius, b.y - Math.sin(b.angle) * b.radius, 5, '#f80');
      }
    }

    // Wedge plow - get under opponent
    if (a.build.secondary === 'wedgePlow') {
      const aToB3 = Math.atan2(dy, dx);
      if (Math.abs(normalizeAngle(aToB3 - a.angle)) < Math.PI / 3) {
        b.vy -= 0.8;
        b.vx += nx * 2;
        b.vy += ny * 2;
      }
    }
    if (b.build.secondary === 'wedgePlow') {
      const bToA3 = Math.atan2(-dy, -dx);
      if (Math.abs(normalizeAngle(bToA3 - b.angle)) < Math.PI / 3) {
        a.vy -= 0.8;
        a.vx -= nx * 2;
        a.vy -= ny * 2;
      }
    }

    // Generic collision impact sound + sparks
    if (relSpeed > 2) {
      playSound('impact', Math.min(0.5, relSpeed * 0.05));
      spawnSparks((a.x + b.x)/2, (a.y + b.y)/2, Math.floor(relSpeed), '#ddd');
      addShake(relSpeed * 0.5);
    }
  }

  // Crusher damage over time
  if (a.grabTarget === b && a.build.primary === 'crusher') {
    damageBot(b, PRIMARY_WEAPONS.crusher.damage * dt, 'crusher');
    if (Math.random() < 0.2) spawnSparks(b.x, b.y, 2, '#f80');
    // Keep them together
    const gdx = a.x - b.x, gdy = a.y - b.y;
    const gd = Math.sqrt(gdx*gdx + gdy*gdy);
    if (gd > a.radius * 0.5) {
      b.x += gdx * 0.1;
      b.y += gdy * 0.1;
    }
  }
  if (b.grabTarget === a && b.build.primary === 'crusher') {
    damageBot(a, PRIMARY_WEAPONS.crusher.damage * dt, 'crusher');
    if (Math.random() < 0.2) spawnSparks(a.x, a.y, 2, '#f80');
    const gdx = b.x - a.x, gdy = b.y - a.y;
    const gd = Math.sqrt(gdx*gdx + gdy*gdy);
    if (gd > b.radius * 0.5) {
      a.x += gdx * 0.1;
      a.y += gdy * 0.1;
    }
  }
}

function checkHazards(bot, dt) {
  if (!bot.alive || bot.isAirborne) return;
  for (const h of hazards) {
    const dx = bot.x - h.x, dy = bot.y - h.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < bot.radius + h.radius) {
      if (h.type === 'floorSpinner') {
        damageBot(bot, h.damage * dt, 'hazard');
        const pushAngle = Math.atan2(dy, dx) + Math.PI / 4;
        bot.vx += Math.cos(pushAngle) * 1;
        bot.vy += Math.sin(pushAngle) * 1;
        if (Math.random() < 0.3) spawnSparks(bot.x, bot.y, 2, '#fc4');
      } else if (h.type === 'pit') {
        damageBot(bot, h.damage, 'hazard');
        bot.vx *= 0.1;
        bot.vy *= 0.1;
        bot.isFlipped = true;
        bot.flipTimer = 2;
        playSound('impact', 0.6);
        addShake(10);
      } else if (h.type === 'fireJet' && h.active) {
        damageBot(bot, h.damage * dt * 2, 'hazard');
        spawnFire(bot.x, bot.y, 1);
      } else if (h.type === 'hammerZone' && h.active && h.hammerAnim > 0.5) {
        damageBot(bot, h.damage, 'hazard');
        bot.vx += (Math.random() - 0.5) * 3;
        bot.vy += (Math.random() - 0.5) * 3;
        addShake(8);
        h.active = false;
      }
    }
  }
}

function updateHazards(dt) {
  for (const h of hazards) {
    if (h.type === 'floorSpinner') {
      h.angle += dt * 5;
    } else if (h.type === 'fireJet') {
      h.timer += dt;
      if (h.timer > 4) { h.active = true; }
      if (h.timer > 5.5) { h.active = false; h.timer = 0; }
      if (h.active) spawnFire(h.x + (Math.random()-0.5)*10, h.y + (Math.random()-0.5)*10, 1);
    } else if (h.type === 'hammerZone') {
      h.timer += dt;
      if (h.timer > 3.5) {
        h.active = true;
        h.hammerAnim = Math.min(1, h.hammerAnim + dt * 4);
        if (h.hammerAnim >= 1 && h.timer < 4.2) {
          playSound('hammer', 0.3);
          addShake(5);
        }
      }
      if (h.timer > 4.5) {
        h.active = false;
        h.hammerAnim = Math.max(0, h.hammerAnim - dt * 2);
        if (h.hammerAnim <= 0) h.timer = 0;
      }
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx;
    p.y += p.vy;
    if (p.type === 'smoke' || p.type === 'fire') {
      p.vx *= 0.98;
      p.size += dt * 3;
    }
    if (p.type === 'debris') {
      p.vy += 0.05; // gravity
      p.rot += p.rotSpeed * dt;
    }
    p.vx *= 0.98;
    p.vy *= 0.98;
  }
}

// ============================================================
// RENDERING
// ============================================================
function drawArena() {
  const ox = (W - arenaW) / 2 + screenShake.x;
  const oy = (H - arenaH) / 2 + screenShake.y;

  ctx.save();
  ctx.translate(ox, oy);

  // Floor
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, arenaW, arenaH);

  // Grid
  ctx.strokeStyle = '#252525';
  ctx.lineWidth = 1;
  for (let x = 0; x <= arenaW; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, arenaH); ctx.stroke();
  }
  for (let y = 0; y <= arenaH; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(arenaW, y); ctx.stroke();
  }

  // Hazards
  for (const h of hazards) {
    if (h.type === 'floorSpinner') {
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.angle);
      // Spinning disc
      ctx.beginPath();
      ctx.arc(0, 0, h.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#333';
      ctx.fill();
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Blades
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2;
        ctx.fillStyle = '#666';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a - 0.3) * h.radius, Math.sin(a - 0.3) * h.radius);
        ctx.lineTo(Math.cos(a + 0.1) * h.radius * 0.7, Math.sin(a + 0.1) * h.radius * 0.7);
        ctx.fill();
      }
      // Warning circle
      ctx.beginPath();
      ctx.arc(0, 0, h.radius + 5, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,180,0,0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    } else if (h.type === 'pit') {
      ctx.beginPath();
      ctx.rect(h.x - h.radius, h.y - h.radius, h.radius * 2, h.radius * 2);
      ctx.fillStyle = '#060606';
      ctx.fill();
      ctx.strokeStyle = '#f00';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
      // Glow
      const gr = ctx.createRadialGradient(h.x, h.y, h.radius * 0.5, h.x, h.y, h.radius * 1.5);
      gr.addColorStop(0, 'rgba(255,0,0,0)');
      gr.addColorStop(1, 'rgba(255,0,0,0.1)');
      ctx.fillStyle = gr;
      ctx.fillRect(h.x - h.radius * 1.5, h.y - h.radius * 1.5, h.radius * 3, h.radius * 3);
    } else if (h.type === 'fireJet') {
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
      ctx.fillStyle = h.active ? '#422' : '#222';
      ctx.fill();
      ctx.strokeStyle = h.active ? '#f60' : '#444';
      ctx.lineWidth = 2;
      ctx.stroke();
      if (h.active) {
        const gr = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.radius * 2);
        gr.addColorStop(0, 'rgba(255,120,0,0.4)');
        gr.addColorStop(1, 'rgba(255,60,0,0)');
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.radius * 2, 0, Math.PI * 2);
        ctx.fill();
      }
      // Nozzle holes
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(h.x + Math.cos(a) * h.radius * 0.5, h.y + Math.sin(a) * h.radius * 0.5, 3, 0, Math.PI * 2);
        ctx.fillStyle = h.active ? '#f80' : '#333';
        ctx.fill();
      }
    } else if (h.type === 'hammerZone') {
      // Zone circle
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.radius + 5, 0, Math.PI * 2);
      ctx.fillStyle = h.active ? 'rgba(255,0,0,0.15)' : 'rgba(255,255,0,0.05)';
      ctx.fill();
      ctx.strokeStyle = h.active ? '#f44' : '#553';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.stroke();
      ctx.setLineDash([]);
      // Hammer arm
      ctx.save();
      ctx.translate(h.x, h.y);
      const hamA = -Math.PI / 2 + h.hammerAnim * Math.PI / 2;
      ctx.rotate(hamA);
      ctx.fillStyle = '#666';
      ctx.fillRect(-3, -5, 6, -35);
      ctx.fillStyle = '#888';
      ctx.fillRect(-8, -42, 16, 12);
      ctx.restore();
    }
  }

  // Walls
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 4;
  ctx.strokeRect(0, 0, arenaW, arenaH);
  // Corner accents
  const cs = 20;
  ctx.strokeStyle = '#e44';
  ctx.lineWidth = 3;
  [[0,0,cs,0,0,cs],[arenaW,0,-cs,0,0,cs],[0,arenaH,cs,0,0,-cs],[arenaW,arenaH,-cs,0,0,-cs]].forEach(([x,y,x2,y2,x3,y3]) => {
    ctx.beginPath(); ctx.moveTo(x+x2, y+y2); ctx.lineTo(x, y); ctx.lineTo(x+x3, y+y3); ctx.stroke();
  });

  // Robots
  [enemyBot, playerBot].forEach(bot => {
    if (!bot || !bot.alive) return;
    ctx.save();
    ctx.translate(bot.x, bot.y);

    // Hit flash
    if (bot.hitFlash > 0) {
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 15;
    }

    drawRobot(ctx, bot, 1);

    ctx.shadowBlur = 0;

    // Health bar above bot
    const barW = 40, barH = 4;
    const hpPct = bot.hp / bot.maxHp;
    ctx.fillStyle = '#300';
    ctx.fillRect(-barW/2, -bot.radius - 12, barW, barH);
    ctx.fillStyle = hpPct > 0.5 ? '#4c4' : hpPct > 0.25 ? '#ec4' : '#e44';
    ctx.fillRect(-barW/2, -bot.radius - 12, barW * hpPct, barH);

    // Name
    ctx.fillStyle = '#aaa';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(bot.name, 0, -bot.radius - 16);

    ctx.restore();
  });

  // Particles
  for (const p of particles) {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    if (p.type === 'spark') {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    } else if (p.type === 'smoke') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    } else if (p.type === 'fire') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      const fa = alpha > 0.5 ? '#ff0' : '#f80';
      ctx.fillStyle = fa;
      ctx.fill();
    } else if (p.type === 'debris') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

// ============================================================
// HUD UPDATE
// ============================================================
function updateHUD() {
  if (!playerBot || !enemyBot) return;
  const php = Math.max(0, playerBot.hp), phm = playerBot.maxHp;
  const ehp = Math.max(0, enemyBot.hp), ehm = enemyBot.maxHp;

  document.getElementById('hudPlayerHp').style.width = (php / phm * 100) + '%';
  document.getElementById('hudPlayerHpText').textContent = `${Math.ceil(php)}/${phm}`;
  document.getElementById('hudEnemyHp').style.width = (ehp / ehm * 100) + '%';
  document.getElementById('hudEnemyHpText').textContent = `${Math.ceil(ehp)}/${ehm}`;

  const mins = Math.floor(fightTimer / 60);
  const secs = Math.floor(fightTimer % 60);
  document.getElementById('hudTimer').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

  // Cooldown bars
  const cdP = document.getElementById('cdPrimary');
  const cdS = document.getElementById('cdSecondary');
  if (cdP) {
    const pw = playerBot.build.primary;
    let cd = 0, maxCd = 1;
    if (pw === 'flipper') { cd = playerBot.flipperCooldown; maxCd = 2000; }
    else if (pw === 'hammer') { cd = playerBot.hammerCooldown; maxCd = 2000; }
    else if (pw === 'crusher') { cd = playerBot.crusherCooldown; maxCd = 2500; }
    cdP.style.width = (cd > 0 ? (1 - cd/maxCd) * 100 : 100) + '%';
  }
  if (cdS) {
    const sw = playerBot.build.secondary;
    if (sw === 'turboBoost') {
      cdS.style.width = (playerBot.turboCooldown > 0 ? (1 - playerBot.turboCooldown/3000) * 100 : 100) + '%';
    } else {
      cdS.style.width = '100%';
    }
  }
}

// ============================================================
// GAME LOOP
// ============================================================
let lastTime = 0;
function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  let dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  // Slow motion
  if (slowMo > 0) {
    slowMo -= dt;
    dt *= 0.25;
  }

  // Clear
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  if ((gameState === 'fight' || gameState === 'test') && playerBot && enemyBot) {
    // Countdown
    if (!fightStarted) {
      countdownTimer -= dt * (slowMo > 0 ? 4 : 1); // Don't slow countdown
      drawArena();
      updateHUD();

      // Draw countdown text
      const ox = (W - arenaW) / 2;
      const oy = (H - arenaH) / 2;
      ctx.save();
      ctx.translate(ox + arenaW/2, oy + arenaH/2);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 72px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (countdownTimer > 0) {
        ctx.fillText(Math.ceil(countdownTimer).toString(), 0, 0);
      } else {
        ctx.fillStyle = '#e44';
        ctx.fillText('FIGHT!', 0, 0);
        if (countdownTimer < -0.8) fightStarted = true;
      }
      ctx.restore();
      return;
    }

    // Timer
    fightTimer -= dt;
    if (fightTimer <= 0) {
      fightTimer = 0;
      // Time out - most HP wins
      endFight(playerBot.hp / playerBot.maxHp >= enemyBot.hp / enemyBot.maxHp);
      return;
    }

    // Check win/lose
    if (!playerBot.alive) { endFight(false); return; }
    if (!enemyBot.alive) { endFight(true); return; }

    // Update
    handlePlayerInput(playerBot, dt);
    updateAI(enemyBot, dt);
    updateBot(playerBot, dt);
    updateBot(enemyBot, dt);
    checkBotCollision(playerBot, enemyBot, dt);
    checkHazards(playerBot, dt);
    checkHazards(enemyBot, dt);
    updateHazards(dt);
    updateParticles(dt);

    // Screen shake decay
    if (screenShake.intensity > 0) {
      screenShake.x = (Math.random() - 0.5) * screenShake.intensity;
      screenShake.y = (Math.random() - 0.5) * screenShake.intensity;
      screenShake.intensity *= 0.9;
      if (screenShake.intensity < 0.5) screenShake.intensity = 0;
    } else {
      screenShake.x = 0;
      screenShake.y = 0;
    }

    drawArena();
    updateHUD();
  } else if (gameState === 'title') {
    // Animated background for title
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, W, H);
  }
}

requestAnimationFrame(gameLoop);

// ============================================================
// FIGHT END
// ============================================================
function endFight(playerWon) {
  if (gameState === 'test') {
    // Test mode just goes back to builder
    gameState = 'title';
    stopEngine();
    document.getElementById('hud').classList.remove('active');
    showBuilder(false);
    return;
  }
  gameState = 'result';
  stopEngine();

  setTimeout(() => {
    document.getElementById('hud').classList.remove('active');
    showScreen('resultScreen');

    const titleEl = document.getElementById('resultTitle');
    const infoEl = document.getElementById('resultInfo');
    const btnsEl = document.getElementById('resultButtons');

    if (playerWon) {
      titleEl.textContent = 'VICTORY!';
      titleEl.className = 'result-title win';
      playSound('cheer', 0.5);

      if (gameMode === 'tournament') {
        tournamentRound++;
        if (tournamentRound >= 4) {
          infoEl.textContent = 'You won the tournament! Champion!';
          btnsEl.innerHTML = '<button class="btn" onclick="showScreen(\'titleScreen\');gameState=\'title\'">Back to Menu</button>';
        } else {
          infoEl.textContent = `Round ${tournamentRound} of 4 complete. HP partially restored.`;
          // Restore some HP
          playerBuild._savedHp = Math.min(playerBot.maxHp, playerBot.hp + playerBot.maxHp * 0.3);
          btnsEl.innerHTML = '<button class="btn" onclick="nextTournamentRound()">Next Round</button>';
        }
      } else if (gameMode === 'build') {
        infoEl.textContent = 'Your robot wins! Fight again?';
        btnsEl.innerHTML = '<button class="btn" onclick="startFight()">Fight Again</button><button class="btn" onclick="showBuilder(false);gameState=\'title\'">Rebuild</button><button class="btn" onclick="showScreen(\'titleScreen\');gameState=\'title\'">Menu</button>';
      } else {
        infoEl.textContent = 'Your robot wins!';
        btnsEl.innerHTML = '<button class="btn" onclick="startMode(\'quick\')">Rematch</button><button class="btn" onclick="showScreen(\'titleScreen\');gameState=\'title\'">Menu</button>';
      }
    } else {
      titleEl.textContent = 'DEFEATED';
      titleEl.className = 'result-title lose';
      playSound('buzzer', 0.4);

      if (gameMode === 'tournament') {
        infoEl.textContent = `Eliminated in round ${tournamentRound + 1}.`;
        btnsEl.innerHTML = '<button class="btn" onclick="tournamentRound=0;showBuilder(false)">Try Again</button><button class="btn" onclick="showScreen(\'titleScreen\');gameState=\'title\'">Menu</button>';
      } else {
        infoEl.textContent = `Destroyed by ${enemyBot.name}!`;
        btnsEl.innerHTML = '<button class="btn" onclick="startFight()">Rematch</button><button class="btn" onclick="showScreen(\'titleScreen\');gameState=\'title\'">Menu</button>';
      }
    }
  }, slowMo > 0 ? 1200 : 500);
}

function nextTournamentRound() {
  // Keep player build, start next fight
  startFight();
  // Restore saved HP
  if (playerBuild._savedHp) {
    playerBot.hp = Math.min(playerBot.maxHp, playerBuild._savedHp);
    delete playerBuild._savedHp;
  }
}

// ============================================================
// INITIAL PREVIEW ANIMATION
// ============================================================
setInterval(() => {
  if (document.getElementById('builderScreen').classList.contains('active')) {
    renderPreview();
  }
}, 50);

</script>
